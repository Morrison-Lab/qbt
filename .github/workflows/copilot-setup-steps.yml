# GitHub Copilot Setup Steps for qbt
#
# This workflow configures the GitHub Copilot coding agent's environment
# by preinstalling R, Quarto, TinyTeX, and system dependencies.
#
# See: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment
#
# This workflow sets up:
# - Quarto CLI for rendering
# - TinyTeX for PDF output

name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation,
# and allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    
    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      contents: read
    
    # Timeout after 50 minutes (qbt#28 caps every job here at 50; the
    # copilot-setup-steps maximum is 59)
    timeout-minutes: 50
    
    steps:
      # Checkout code - Copilot will do this automatically if we don't,
      # but we need it for any repository-specific setup
      - name: Checkout code
        uses: actions/checkout@v7
      
      # Install system dependencies required for R packages
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev
      
      # Set up pandoc for documentation
      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2
      
      # Set up R using the standard GitHub Actions setup
      # Using 'release' to get the latest R version
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      
      # Set up Quarto - required for rendering the website
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          # Same reason as preview.yml and publish.yml: `tinytex: true`
          # resolves the latest rstudio/tinytex-releases release through the
          # GitHub API, and Quarto reads only GH_TOKEN for that call. Without
          # it the request is unauthenticated and shares the runner IP's
          # 60-per-hour limit, giving an intermittent 403 (#66). This job set
          # no token at all, so it was fully exposed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true
      
      # Verify development environment is properly configured
      - name: Verify development environment
        run: |
          echo "=== Development Environment Status ==="
          
          # Check R installation
          Rscript -e 'cat("R version:", R.version.string, "\n")'
          
          # Verify Quarto is installed and working
          echo ""
          echo "=== Quarto Status ==="
          quarto --version
          quarto list tools
          
          echo ""
          echo "Development environment setup complete!"
