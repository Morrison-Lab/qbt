# Fails when the repository tracks OS or editor detritus (.DS_Store,
# AppleDouble ._*, .Rhistory, .RData, Thumbs.db). The tree is currently
# clean, so this runs blocking from the start.
name: Check Junk Files

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-junk-files.yml@v2
