# Scans the repository's git HISTORY for committed credentials -- API tokens,
# private keys, high-entropy password assignments -- using gitleaks.
# History rather than the diff: a secret committed and then removed in a later
# commit is still exposed, because the orphaned commit stays fetchable through
# the GitHub API until the repository is garbage-collected.
#
# Suppressing a false positive: add a `gitleaks:allow` comment on the line, or
# paste its fingerprint (printed whole in the run summary, as
# `<commit>:<file>:<rule>:<line>`) verbatim into a root `.gitleaksignore`.
name: Check for secrets

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-secrets.yml@v2
