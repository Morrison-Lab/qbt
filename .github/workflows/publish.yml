# Renders the book (every format _quarto.yml declares, so the PDF, EPUB and
# Word downloads exist) and deploys it to the gh-pages branch, which GitHub
# Pages serves, keeping the pr-preview/ subtree.
#
# Do NOT name a `concurrency:` group `gh-pages` in this caller (deadlock,
# https://github.com/Morrison-Lab/gha/issues/809).
name: Quarto Publish

on:
  workflow_dispatch:
  push:
    branches: main

# Serialize this workflow's own runs; `cancel-in-progress: false` so a
# half-written deploy finishes rather than being killed part-way.
concurrency:
  group: quarto-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    uses: Morrison-Lab/gha/.github/workflows/quarto-publish.yml@v3
    with:
      setup-r: true
      r-packages: |
        any::knitr
        any::rmarkdown
        any::tibble
        any::ggplot2
      # PDF is part of the book's downloads, so TinyTeX is needed.
      tinytex: true
      output-dir: docs
      # Empty `formats` is a single bare `quarto render` here, as before.
      checkout-submodules: true
