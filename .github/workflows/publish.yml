on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    # Serialize gh-pages writes against the PR-preview deploys and the weekly
    # preview cleanup, which target the same branch. Without a shared group,
    # a publish and a preview deploy push concurrently and one of them loses
    # the race (see issue #62). cancel-in-progress: false queues rather than
    # kills, so no publish of main is silently dropped. Note that GitHub
    # retains only ONE pending run per group, superseding older pending runs;
    # that is acceptable here because a superseded publish is always followed
    # by a newer one rendering the same branch.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R packages
        run: |
          install.packages(c("knitr", "rmarkdown", "tibble"), repos = "https://packagemanager.posit.co/cran/__linux__/noble/latest")
        shell: Rscript {0}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/
          clean-exclude: pr-preview/
          force: false
