on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    # Serialize gh-pages writes against the PR-preview deploys and the weekly
    # preview cleanup, which target the same branch. Without a shared group,
    # a publish and a preview deploy push concurrently and one of them loses
    # the race (see issue #62). cancel-in-progress: false queues rather than
    # kills, so no publish of main is silently dropped.
    #
    # queue: max is required for that guarantee, not optional. Under the
    # default queue: single, a pending publish is cancelled as soon as any
    # newer run joins the group -- including a PR preview deploy, which is
    # unrelated to main. Since this job had no concurrency group at all
    # before, omitting queue: max would REGRESS it: a publish of main could
    # be dropped outright rather than merely delayed. See the matching
    # comment in preview.yml for the GHES-availability and actionlint caveats.
    #
    # Known tradeoff: this group sits on the whole job, so a main-branch
    # render holds the gh-pages queue for its full duration and delays every
    # PR preview deploy behind it. preview.yml avoids that by splitting
    # render from deploy; doing the same here is the obvious follow-up and is
    # deliberately NOT bundled into this PR, because publish.yml only ever
    # runs on push to main and so cannot be exercised on the PR that changes
    # it -- getting it wrong stops the book publishing. Sequenced as its own
    # change once the preview split has run in production. Tracked in #68.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R packages
        run: |
          install.packages(c("knitr", "rmarkdown", "tibble"), repos = "https://packagemanager.posit.co/cran/__linux__/noble/latest")
        shell: Rscript {0}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GH_TOKEN is the one that actually does the work here, and it is
          # not a duplicate of the line above. `tinytex: true` runs
          # `quarto install tool tinytex`, which resolves the latest
          # rstudio/tinytex-releases release through the GitHub API. Quarto
          # reads ONLY GH_TOKEN for that call (src/tools/github.ts:
          # `Deno.env.get("GH_TOKEN") ? {headers: {Authorization: ...}} :
          # undefined`), so with GITHUB_TOKEN alone the request goes out
          # unauthenticated and shares the runner IP's 60-per-hour limit --
          # producing an intermittent `403 - Forbidden` that passes on
          # re-run and looks like a flake (#66).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/
          clean-exclude: pr-preview/
          force: false
