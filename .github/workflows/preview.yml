# Build half of the PR-preview family: renders the book in the (possibly fork)
# PR context and uploads it + PR metadata as an artifact. The deploy half
# (preview-deploy.yml) publishes it to gh-pages. The jobs here are read-only
# (contents: read) -- they must never write to the base repo.
#
# IMPORTANT: keep this workflow's `name:` in sync with the `workflows:` list in
# preview-deploy.yml -- that's how the deploy half finds this run.
#
# Do NOT name a `concurrency:` group `gh-pages` in this caller (deadlock,
# https://github.com/Morrison-Lab/gha/issues/809). The reusable workflow
# already cancels a superseded preview build for the same ref.
name: Quarto Preview Build

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]

jobs:
  build:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/preview.yml@v3
    with:
      r-version: release
      # Non-renv repo: install the packages the book's chunks load.
      use-renv: false
      r-packages: |
        any::knitr
        any::rmarkdown
        any::tibble
        any::ggplot2
      # This repo has a DESCRIPTION for lintr and tooling, but pages do not
      # call its functions, and the old workflow never installed it.
      install-package: false
      apt-packages: ''
      setup-chrome: false
      # PDF output is part of the default render below, so TinyTeX is always needed.
      tinytex: true
      # A book project has no `website` profile.
      render-profile: ''
      output-dir: docs
      # One bare `quarto render` of every format _quarto.yml declares (html, pdf,
      # docx, epub), so any slide-deck (revealjs) format added later is built in
      # previews too. Never leave this empty: empty selects a legacy branch that
      # renders html plus only the formats requested by `preview:*` labels.
      formats: default
      # Rebuild when this label is added or removed (it toggles highlighting below).
      extra-preview-labels: '["no-preview-highlights"]'
      # Compare against the published render: banner on the home page, highlighted
      # text on changed pages, and Word files with tracked changes. Highlighting
      # is off while the PR carries the `no-preview-highlights` label.
      changed-chapters-banner: true
      highlight-changes: ${{ !contains(github.event.pull_request.labels.*.name, 'no-preview-highlights') }}
      docx-tracked-changes: true
      # A book's pages and its Word download all sit at the top of docs/.
      changed-chapters-glob: '*.html'
      docx-tracked-changes-glob: '*.docx'

  # gha's home-page banner has no link to the tracked-changes Word file, so this
  # job adds one inside it (gha#1025). It edits the staged artifact before the
  # deploy workflow (which runs only after this whole workflow finishes) publishes
  # it. Same trust level as the build job: read-only token, PR code.
  docx-link:
    needs: build
    if: github.event.action != 'closed' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download preview artifact
        uses: actions/download-artifact@v8
        with:
          name: pr-preview-site
          path: preview_artifact/
      - name: Add the Word link to the home-page banner
        run: python3 .github/scripts/add-docx-link.py
        env:
          # gha stages the rendered site under `site/` in the artifact.
          RENDERED_DIR: preview_artifact/site
      # Same name and settings as gha's own upload, plus `include-hidden-files`
      # so a dotfile in the artifact is not dropped by the re-upload.
      - name: Replace preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-preview-site
          path: preview_artifact/
          overwrite: true
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  # Preserves the `build-deploy` required status check named in
  # .github/rulesets/main.json: renaming it would leave the ruleset waiting on a
  # check no job ever reports. Writing to gh-pages now happens in
  # preview-deploy.yml, a separate workflow, so this reports the build half only.
  #
  # A failed or cancelled build, or a failed docx-link job, fails this check.
  # A skipped build is acceptable only on a label event: gha skips the build for
  # labels it does not act on, and the head commit was already built. GitHub
  # counts a skipped required check as satisfied, so any other skip must fail here.
  build-deploy:
    needs: [build, docx-link]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report preview pipeline result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DOCX_LINK_RESULT: ${{ needs.docx-link.result }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          echo "build=$BUILD_RESULT docx-link=$DOCX_LINK_RESULT action=$EVENT_ACTION"
          failed=0
          case "$BUILD_RESULT" in
            success) ;;
            skipped)
              case "$EVENT_ACTION" in
                labeled|unlabeled) ;;
                *) echo "::error::preview build was skipped on a $EVENT_ACTION event"; failed=1 ;;
              esac ;;
            *) echo "::error::preview build did not succeed ($BUILD_RESULT)"; failed=1 ;;
          esac
          case "$DOCX_LINK_RESULT" in
            success|skipped) ;;
            *) echo "::error::docx-link job did not succeed ($DOCX_LINK_RESULT)"; failed=1 ;;
          esac
          exit "$failed"
