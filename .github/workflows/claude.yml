# Calls the reusable Claude Code workflow in Morrison-Lab/gha. Secrets are passed
# explicitly (not via `secrets: inherit`) so the cross-repo call always forwards
# a real token. The reusable workflow enforces the @claude mention + trusted-author
# gate, so no caller-side `if:` is needed.
#
# Pinned to the @v2 moving major tag — the upstream-recommended consumer pin.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    uses: Morrison-Lab/gha/.github/workflows/claude.yml@v2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
    with:
      install-quarto: true        # qbt is a Quarto book
      checkout-submodules: true   # qbt vendors content via submodules
      # A session can run long enough that new comments arrive while it works,
      # and they are invisible unless the agent looks again before finishing
      # (qbt#41).
      prompt-addendum: |
        Before you end this session, re-read the issue or pull request you are
        working on and check for comments posted after you started. A review,
        a correction, or a change of direction can arrive mid-session, and it
        is not delivered to you automatically.

        Address anything new the same way you would have if it had been there
        at the start: make the change, or reply saying why you are not. Only
        finish once nothing is left unanswered.
