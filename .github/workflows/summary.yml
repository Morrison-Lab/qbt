# AI-generated summary comment on newly opened issues, via the reusable workflow
# in Morrison-Lab/gha. Uses GitHub Models (the `models: read` grant), no extra secret.
#
# Pinned to the @v2 moving major tag.
name: Issue Summary

on:
  issues:
    types: [opened]

jobs:
  summary:
    permissions:
      contents: read
      issues: write
      models: read
    # @v2 adds endpoint/model inputs and degrades gracefully when inference
    # is unavailable, instead of hard-failing. Needed because GitHub Models,
    # the original default endpoint, is in scheduled retirement brownout
    # (gha#617) -- on @v1 this workflow starts failing outright once that
    # lands.
    uses: Morrison-Lab/gha/.github/workflows/summary.yml@v2
