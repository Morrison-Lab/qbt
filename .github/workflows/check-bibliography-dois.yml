# Validates DOIs in the repo's .bib files, via the reusable workflow in
# Morrison-Lab/gha. Pinned to the @v2 moving major tag.
name: Check Bibliography DOIs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # Declared explicitly so the job does not fall back to the repository's
    # default token scope, which is broader than this check needs. Every
    # other gha caller in this repo already does this.
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-bibliography-dois.yml@v2
