project:
  type: book
  output-dir: docs
  pre-render:
    # install-extensions.py runs first: it fetches the custom-callout
    # extension that the HTML filters below need.
    - tools/install-extensions.py
    - pre-render.py
  resources:
    - macros/macros.qmd

book:
  title: "Your Book Title"
  author: "Your Name"
  date: last-modified
  date-format: "[Last updated:] YYYY-MM-DD"
  # Replace with your own repository when using this template: repo-url
  # feeds repo-actions below, so every rendered page links here.
  repo-url: https://github.com/Morrison-Lab/qbt
  repo-actions: [edit, source, issue]
  downloads: [pdf, epub, docx]
  chapters:
    - index.qmd
    - chapter1.qmd
    - chapter2.qmd
    - references.qmd
  appendices:
    - appendix-document-metadata.qmd
  page-navigation: true

bibliography: references.bib

filters:
  - d-morrison/code-language-labels


# Theorem-type and exercise divs render as colored callouts, as in lds and
# Morrison-Lab/rme: `callouty-theorem` wraps each `#def-`, `#exr-`,
# `#exm-` ... div in a callout, and `custom-callout` gives each type its color.
# These blocks follow lds's `_quarto-website.yml`. HTML only: the PDF, Word
# and EPUB outputs keep Quarto's own theorem headings.
callouty-theorem:
  thm:
    callout:
      type: lem
  lem:
    callout:
      type: lem
  cor:
    callout:
      type: cor
  prp:
    callout:
      type: prp
  cnj:
    callout:
      type: cnj
  def:
    callout:
      type: def
  exm:
    callout:
      type: exm
      icon: false
  exr:
    callout:
      type: exr

custom-callout:
  lem:
    color: "#1565C0"  # royal blue (also used for thm)
  cor:
    color: "#00838F"  # dark cyan
  prp:
    color: "#827717"  # dark olive
  cnj:
    color: "#558B2F"  # grass green
  def:
    color: "#1B5E20"  # forest green
  exm:
    color: "#6A1B9A"  # deep purple
  exr:
    color: "#FFA500"  # orange

format:
  html:
    filters:
      - Morrison-Lab/callouty-theorem
      # By path, not extension name: Quarto looks extensions up before a
      # `pre-render` script runs, so the copy that tools/install-extensions.py
      # fetches would not be found by name.
      - _extensions/coatless-quarto/custom-callout/customcallout.lua
      - _extensions/coatless-quarto/custom-callout/fa.lua
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    number-sections: true
    embed-resources: false
    include-in-header:
      - macros-header.html
  pdf:
    include-in-header:
      - macros-pdf.tex
    geometry:
      - top=15mm
      - bottom=20mm
    keep-md: false
    keep-tex: false
    toc: true
    fig-pos: "H"
    hyperrefoptions:
    - bookmarksnumbered=true
    toc-title: Contents
    df-print: tibble
    links-as-notes: true
    documentclass: scrbook
    classoption: [twoside=off]
    shift-heading-level-by: 0
    toc-depth: 2
    number-sections: true
    number-depth: 3
    colorlinks: true
  docx:
    toc: false
    number-sections: true
    highlight-style: github
  epub:
    toc: true
    number-sections: true

editor: source
