project:
  type: book
  output-dir: docs
  pre-render: pre-render.py
  resources:
    - macros/macros.qmd

book:
  title: "Your Book Title"
  author: "Your Name"
  date: last-modified
  date-format: "[Last updated:] YYYY-MM-DD"
  # Replace with your own repository when using this template: repo-url
  # feeds repo-actions below, so every rendered page links here.
  repo-url: https://github.com/Morrison-Lab/qbt
  repo-actions: [edit, source, issue]
  downloads: [pdf, epub, docx]
  chapters:
    - index.qmd
    - chapter1.qmd
    - chapter2.qmd
    - references.qmd
  appendices:
    - appendix-document-metadata.qmd
  page-navigation: true

bibliography: references.bib

filters:
  - d-morrison/code-language-labels

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    number-sections: true
    embed-resources: false
    include-in-header:
      - macros-header.html
  pdf:
    include-in-header:
      - macros-pdf.tex
    geometry:
      - top=15mm
      - bottom=20mm
    keep-md: false
    keep-tex: false
    toc: true
    fig-pos: "H"
    hyperrefoptions:
    - bookmarksnumbered=true
    toc-title: Contents
    df-print: tibble
    links-as-notes: true
    documentclass: scrbook
    classoption: [twoside=off]
    shift-heading-level-by: 0
    toc-depth: 2
    number-sections: true
    number-depth: 3
    colorlinks: true
  docx:
    toc: false
    number-sections: true
    highlight-style: github
  epub:
    toc: true
    number-sections: true

editor: source
